services:
  - type: web
    name: dm-ruling-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        value: /app/data/cache.db
      - key: ENABLE_DEBUG_ROUTES
        value: "false"
      - key: DM_CARD_BASE_URL
        value: https://dm.takaratomy.co.jp/card/
      - key: DM_QA_URL
        value: https://dm.takaratomy.co.jp/rule/qa/
      - key: DM_RULE_CHANGE_URL
        value: https://dm.takaratomy.co.jp/rule/rulechange/change/
      - key: DM_GENERAL_RULE_PAGE_URL
        value: https://dm.takaratomy.co.jp/rule/rulechange/
      - key: LLM_API_KEY
        sync: false
      - key: VALID_JUDGE_IDS
        sync: false
    disk:
      name: dm-ruling-bot-data
      mountPath: /app/data
      sizeGB: 1
